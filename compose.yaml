version: "3.7"
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_DISPLAY_NAME: ${PUBLIC_DISPLAY_NAME:-YOUR NAME}
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
